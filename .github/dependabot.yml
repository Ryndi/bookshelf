# Keeps the dependencies of the server (NuGet), the UI (yarn), CI (GitHub Actions),
# the Docker image and the dev container up to date.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Minor and patch updates come once a week, grouped into one pull request per
# ecosystem. Major versions are left out of those: the server still targets .NET 6,
# which the next major of most Microsoft and System packages no longer runs on, and
# the UI's majors (React and the like) need code changes. Those are upgraded by hand.

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # From these versions on, each package needs a change of its own, and one package
      # that fails the build holds back the whole group. These are upgraded by hand too.
      # MailKit 4.18 needs the 10.0 System packages (Pkcs, CodePages, Asn1), above our pins.
      - dependency-name: "Mailkit"
        versions: [">= 4.18.0"]
      # Moq 4.18 moves to Castle.Core 5, which uncovers coverlet.collector's preview pins.
      - dependency-name: "Moq"
        versions: [">= 4.18.0"]
      # NLog 5.2 makes LogManager.ConfigurationReloaded obsolete, which DatabaseTarget
      # uses, and warnings are errors here. NLog.Extensions.Logging 5.3 needs that NLog.
      - dependency-name: "NLog"
        versions: [">= 5.2.0"]
      - dependency-name: "NLog.Extensions.Logging"
        versions: [">= 5.3.0"]
      # 17.2.26 makes FromDirectoryName and FromFileName obsolete, with 14 uses here.
      - dependency-name: "System.IO.Abstractions"
        versions: [">= 17.2.26"]
      - dependency-name: "System.IO.Abstractions.TestingHelpers"
        versions: [">= 17.2.26"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # CI ignores changes under .github, so these pull requests run no build of their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
