# Keeps the dependencies of the server (NuGet), the UI (yarn), CI (GitHub Actions),
# the Docker image and the dev container up to date.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Minor and patch updates come once a week, grouped into one pull request per
# ecosystem. Major versions are left out of those: the server still targets .NET 6,
# which the next major of most Microsoft and System packages no longer runs on, and
# the UI's majors (React and the like) need code changes. Those are upgraded by hand.

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # CI ignores changes under .github, so these pull requests run no build of their own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
